[package]
name = "gapir"
version = "0.1.11"
edition = "2024"
license = "MIT"
description = "Offline Uzbek voice typing for any text field"
default-run = "gapir"

[lib]
name = "gapir_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gapir-core = { path = "../core" }
handy-keys = "0.3.4"
handy-recorder = "0.1"
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
transcribe-cpp = { version = "0.4.1", default-features = false }
ureq = "3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSAnimation", "NSAnimationContext", "NSApplication", "NSColor", "NSControl", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSFont", "NSGraphics", "NSImage", "NSImageView", "NSPanel", "NSPasteboard", "NSResponder", "NSRunningApplication", "NSScreen", "NSSound", "NSTextField", "NSView", "NSWindow", "NSWorkspace"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-application-services = { version = "0.3", features = ["AXUIElement", "HIServices"] }
objc2-core-foundation = { version = "0.3", features = ["CFArray", "CFBase", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3", features = ["CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation", "CGWindow"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSBundle", "NSDictionary", "NSEnumerator", "NSGeometry", "NSString", "NSURL", "NSValue"] }
tauri-nspanel = "2.1.1"
transcribe-cpp = { version = "0.4.1", features = ["metal"] }

[target.'cfg(windows)'.dependencies]
# Backends as DLLs chosen at runtime: Vulkan where the GPU driver has it, otherwise the CPU.
transcribe-cpp = { version = "0.4.1", features = ["vulkan", "dynamic-backends"] }
# Only so build.rs gets DEP_TRANSCRIBE_RUNTIME_DIR, the folder with those DLLs.
transcribe-cpp-sys = { version = "0.4.1", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
# Already under handy-keys: the same virtual keyboard support types the text.
evdev = "0.13"
