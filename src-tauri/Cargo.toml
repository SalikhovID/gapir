[package]
name = "gapir"
version = "0.1.3"
edition = "2021"
license = "MIT"
description = "Offline Uzbek voice typing for any text field"
default-run = "gapir"

[lib]
name = "gapir_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gapir-core = { path = "../core" }
handy-keys = "0.3.4"
handy-recorder = "0.1"
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
transcribe-cpp = "0.4.1"
ureq = "3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication", "NSSound", "NSWorkspace"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-application-services = { version = "0.3", features = ["AXUIElement", "HIServices"] }
objc2-core-foundation = { version = "0.3", features = ["CFBase", "CFString"] }
objc2-core-graphics = { version = "0.3", features = ["CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }
tauri-nspanel = "2.1.1"
