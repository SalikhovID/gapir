[package]
name = "gapir-core"
version = "0.1.5"
edition = "2021"
license = "MIT"
description = "Platform-independent logic of Gapir: state machine, chunking, text cleanup, delivery."

[dependencies]
earshot = "1.2.2"
sha2 = "0.10"
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"

[dev-dependencies]
tempfile = "3"
