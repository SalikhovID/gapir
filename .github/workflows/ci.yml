name: CI

# Pull requests are checked. Every push to main, which includes a merged pull request, is
# checked and then released: the patch version goes up, a "chore: release" commit and the
# vX.Y.Z tag are added, and the signed macOS app, the Windows installer and the Linux AppImage
# are published as one GitHub release.
# Put [skip ci] in a commit message to push to main without a release.
# A minor or major bump is made by hand: scripts/set-version.sh 0.2.0, commit, push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One release at a time, so two quick merges cannot hand out the same version.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # WebKitGTK, tray and menu for Tauri, ALSA headers for the audio library.
  LINUX_PACKAGES: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libasound2-dev

jobs:
  test:
    strategy:
      matrix:
        # 22.04: the AppImage carries no glibc, so it runs on distributions at least this new.
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: jakoch/install-vulkan-sdk-action@v1
        if: runner.os != 'macOS'
        with:
          vulkan_version: 1.4.363.0
          cache: true
      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The Windows, Linux and macOS builds use the same commit and version, so the release gets
  # all of them at once and no updater ever sees a release without its file.
  windows:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags decide the next version
      - uses: dtolnay/rust-toolchain@stable
      - uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.363.0
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build
        run: |
          version="$(scripts/set-version.sh)"
          # Without UTF-8 mode Python writes the cp1252 console encoding and fails.
          PYTHONUTF8=1 python scripts/third-party-licenses.py > THIRD-PARTY-LICENSES.txt
          npx -y @tauri-apps/cli@2.12.4 build --bundles nsis
          cp "target/release/bundle/nsis/Gapir_${version}_x64-setup.exe" Gapir-windows-x64-setup.exe
          sha256sum Gapir-windows-x64-setup.exe > Gapir-windows-x64-setup.exe.sha256
          cat Gapir-windows-x64-setup.exe.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: Gapir-windows-x64-setup.exe*
          if-no-files-found: error

  linux:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags decide the next version
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.363.0
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build
        env:
          # linuxdeploy is itself an AppImage; this runs it without FUSE.
          APPIMAGE_EXTRACT_AND_RUN: 1
          # The CPU tier (all of them ship, see build.rs) is picked at runtime, so no ISA floor.
          # linuxdeploy also bundles libvulkan.so.1; that loader still uses the system's drivers.
        run: |
          version="$(scripts/set-version.sh)"
          python3 scripts/third-party-licenses.py > THIRD-PARTY-LICENSES.txt
          npx -y @tauri-apps/cli@2.12.4 build --bundles appimage
          cp "target/release/bundle/appimage/Gapir_${version}_amd64.AppImage" Gapir-linux-x86_64.AppImage
          sha256sum --binary Gapir-linux-x86_64.AppImage > Gapir-linux-x86_64.AppImage.sha256
          cat Gapir-linux-x86_64.AppImage.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: Gapir-linux-x86_64.AppImage*
          if-no-files-found: error

  macos:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags decide the next version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build, sign and package
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          scripts/set-version.sh
          scripts/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: Gapir-macos-arm64.zip*
          if-no-files-found: error

  release:
    needs: [test, macos, windows, linux]
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags decide the next version
      # Only for cargo in set-version.sh; nothing is built here.
      - uses: dtolnay/rust-toolchain@stable

      - name: Pick the version
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version="$(scripts/set-version.sh)"
          echo "number=$version" >> "$GITHUB_OUTPUT"
          # Committed here, pushed only after the checks pass.
          if ! git diff --quiet; then
            git commit --quiet --all --message "chore: release v$version [skip ci]"
          fi

      - uses: actions/download-artifact@v8
        with:
          name: macos
      - uses: actions/download-artifact@v8
        with:
          name: windows
      - uses: actions/download-artifact@v8
        with:
          name: linux

      - name: Check the build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          check() { "$@" || { echo "::error::check failed: $*"; exit 1; }; }
          requirement() { codesign -d -r- "$1" 2>&1 | grep '^designated'; }

          # Checks the app exactly as users get it, unpacked from the published zip.
          ditto -x -k Gapir-macos-arm64.zip "$RUNNER_TEMP/built"
          app="$RUNNER_TEMP/built/Gapir.app"
          binary="$app/Contents/MacOS/gapir"
          check [ "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "$VERSION" ]
          check [ "$(lipo -archs "$binary")" = "arm64" ]
          # install.sh promises macOS 13, so the build must not ask for more.
          check [ "$(vtool -show-build "$binary" | awk '/minos/ {print $2}')" = "13.0" ]
          check shasum -a 256 -c Gapir-macos-arm64.zip.sha256
          check shasum -a 256 -c Gapir-linux-x86_64.AppImage.sha256
          check shasum -a 256 -c Gapir-windows-x64-setup.exe.sha256

          # Another certificate would make macOS forget the Microphone and Accessibility
          # permissions at every update, so the signature has to match the last release.
          previous="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [ -n "$previous" ]; then
            gh release download "$previous" --pattern Gapir-macos-arm64.zip --dir "$RUNNER_TEMP/previous"
            ditto -x -k "$RUNNER_TEMP/previous/Gapir-macos-arm64.zip" "$RUNNER_TEMP/previous/unpacked"
            check [ "$(requirement "$app")" = "$(requirement "$RUNNER_TEMP/previous/unpacked/Gapir.app")" ]
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          # If main moved while this built, the run for the newer commit releases it.
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "::notice::main moved on during the build, the newer run releases it"
            exit 0
          fi

          notes=(--generate-notes)
          previous="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [ -n "$previous" ]; then
            notes+=(--notes-start-tag "$previous")
          fi

          git push --quiet origin HEAD:main
          gh release create "v$VERSION" Gapir-macos-arm64.zip Gapir-macos-arm64.zip.sha256 \
            Gapir-windows-x64-setup.exe Gapir-windows-x64-setup.exe.sha256 \
            Gapir-linux-x86_64.AppImage Gapir-linux-x86_64.AppImage.sha256 \
            --target "$(git rev-parse HEAD)" --title "Gapir v$VERSION" "${notes[@]}"
