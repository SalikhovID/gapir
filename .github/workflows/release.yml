name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: npx -y @tauri-apps/cli@2.12.4 build --target aarch64-apple-darwin --bundles app

      # A stable identity keeps Microphone and Accessibility permissions across updates.
      # An ad-hoc signature would make macOS treat every release as a different app.
      - name: Sign
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -f pkcs12
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          identity="$(security find-identity -p codesigning "$keychain" | awk '/\)/ {print $2; exit}')"
          [ -n "$identity" ]
          codesign --force --options runtime --timestamp=none \
            --entitlements src-tauri/Entitlements.plist --keychain "$keychain" --sign "$identity" \
            target/aarch64-apple-darwin/release/bundle/macos/Gapir.app
          codesign --verify --strict target/aarch64-apple-darwin/release/bundle/macos/Gapir.app

      - name: Package
        run: |
          cd target/aarch64-apple-darwin/release/bundle/macos
          ditto -c -k --keepParent Gapir.app "$GITHUB_WORKSPACE/Gapir-macos-arm64.zip"
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 Gapir-macos-arm64.zip > Gapir-macos-arm64.zip.sha256

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Gapir-macos-arm64.zip Gapir-macos-arm64.zip.sha256 \
            --title "Gapir $GITHUB_REF_NAME" --generate-notes
